global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local'
    environment: 'dev'

scrape_configs:
  # Scrape toygres-server metrics endpoint directly
  - job_name: 'toygres'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: 'toygres'
          component: 'server'

  # Self-scraping
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


