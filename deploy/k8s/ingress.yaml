apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toygres-ingress
  namespace: toygres-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: toygres
spec:
  tls:
  - hosts:
    - ${TOYGRES_DNS_NAME}
    secretName: toygres-tls
  rules:
  - host: ${TOYGRES_DNS_NAME}
    http:
      paths:
      # Main UI catches everything except /grafana and /prometheus
      - path: /
        pathType: Prefix
        backend:
          service:
            name: toygres-ui
            port:
              number: 80

---
# Separate ingress for Grafana - passes /grafana/* to Grafana as-is
# Grafana is configured with GF_SERVER_SERVE_FROM_SUB_PATH=true so it expects /grafana prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: toygres-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Increase body size for Grafana API
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  labels:
    app.kubernetes.io/name: grafana
spec:
  tls:
  - hosts:
    - ${TOYGRES_DNS_NAME}
    secretName: toygres-tls
  rules:
  - host: ${TOYGRES_DNS_NAME}
    http:
      paths:
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000

---
# Separate ingress for Prometheus - with rewrite since Prometheus doesn't handle sub-path
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: toygres-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  labels:
    app.kubernetes.io/name: prometheus
spec:
  tls:
  - hosts:
    - ${TOYGRES_DNS_NAME}
    secretName: toygres-tls
  rules:
  - host: ${TOYGRES_DNS_NAME}
    http:
      paths:
      - path: /prometheus(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: prometheus
            port:
              number: 9090

