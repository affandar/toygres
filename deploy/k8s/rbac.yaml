apiVersion: v1
kind: ServiceAccount
metadata:
  name: toygres-server
  namespace: toygres-system
  labels:
    app.kubernetes.io/name: toygres
  annotations:
    # Workload Identity: link to Azure managed identity for blob storage access
    azure.workload.identity/client-id: "${AZURE_STORAGE_CLIENT_ID}"
---
# Service account in the instance namespace (for backup/restore jobs)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toygres-server
  namespace: toygres
  labels:
    app.kubernetes.io/name: toygres
  annotations:
    # Workload Identity: link to Azure managed identity for blob storage access
    azure.workload.identity/client-id: "${AZURE_STORAGE_CLIENT_ID}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toygres-server
  labels:
    app.kubernetes.io/name: toygres
rules:
  # Pod management for PostgreSQL instances
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Service management
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PVC management
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # StatefulSet management
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ConfigMap and Secret access
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events for debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Namespace access (for multi-namespace deployments)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Node access (to get Azure region for DNS names)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Job management for backup/restore operations
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: toygres-server
  labels:
    app.kubernetes.io/name: toygres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: toygres-server
subjects:
  - kind: ServiceAccount
    name: toygres-server
    namespace: toygres-system

