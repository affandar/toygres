apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
  labels:
    app: postgres
    instance: {{ name }}
    image-type: {{ image_type }}
spec:
  replicas: 1
  serviceName: {{ name }}
  selector:
    matchLabels:
      app: postgres
      instance: {{ name }}
  template:
    metadata:
      labels:
        app: postgres
        instance: {{ name }}
        image-type: {{ image_type }}
    spec:
      {% if image_type == "pg_durable" %}
      imagePullSecrets:
      - name: acr-secret
      {% endif %}
      containers:
      - name: postgres
        image: {{ image }}
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_PASSWORD
          value: "{{ password }}"
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        {% if image_type == "pg_durable" %}
        - name: PGDATABASE
          value: postgres
        {% endif %}
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: {{ name }}-pvc

